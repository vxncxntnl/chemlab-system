; Caches compiled PHP bytecode in memory so each request doesn't have to
; re-parse the same PHP files from disk. Off by default on the base PHP
; image. validate_timestamps stays on (default/safe) so it still re-checks
; files for changes rather than requiring a manual cache clear on deploy.
opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
