; The official PHP image ships without a php.ini, so PHP's defaults applied:
; 2 MB per uploaded file and 8 MB per request. Phone photos (damage report
; photos, equipment images) are usually 2-6 MB and were rejected by PHP
; before Laravel's own 10 MB validation rule ever ran. These limits sit just
; above that rule; nginx already allows 20 MB (client_max_body_size).
upload_max_filesize=12M
post_max_size=16M
